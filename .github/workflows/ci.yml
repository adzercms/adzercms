name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 1'
  workflow_call:
    inputs:
      runner:
        type: string
      packages:
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

defaults:
  run:
    shell: bash

jobs:
  image:
    uses: ./.github/workflows/php-image.yml
    permissions:
      contents: read
      packages: write
    with:
      runner: ${{ inputs.runner }}
      versions: '["8.4", "8.5"]'
      packages: ${{ inputs.packages }}

  static:
    needs: image
    runs-on: &runner ${{ inputs.runner || 'ubuntu-24.04' }}
    strategy:
      matrix:
        php: &versions ${{ fromJSON(needs.image.outputs.versions) }}
    container: &php
      image: ${{ needs.image.outputs.repository }}:${{ matrix.php }}-${{ needs.image.outputs.hash }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &composer
        uses: ramsey/composer-install@v4
      - run: vendor/bin/adzercms-check

  tests:
    needs: image
    runs-on: *runner
    strategy:
      fail-fast: false
      matrix:
        php: *versions
        db:
          - image: mysql:lts
            health: mysqladmin ping -h 127.0.0.1 -padzercms
            url: mysql://root:adzercms@db:3306/adzercms_test?charset=utf8mb4
          - image: mariadb:lts
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:adzercms@db:3306/adzercms_test?charset=utf8mb4
          - image: postgres:latest
            health: pg_isready -U postgres
            url: postgresql://postgres:adzercms@db:5432/adzercms_test?charset=utf8
    container: *php
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: adzercms
          MYSQL_DATABASE: adzercms_test
          MARIADB_ROOT_PASSWORD: adzercms
          MARIADB_DATABASE: adzercms_test
          POSTGRES_PASSWORD: adzercms
          POSTGRES_DB: adzercms_test
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und
        options: >-
          --health-cmd "${{ matrix.db.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: ${{ matrix.db.url }}
    steps:
      - *checkout
      - *composer
      - run: |
          for suite in $(sed -n 's/.*<testsuite name="\([^"]*\)".*/\1/p' phpunit.dist.xml); do
            bin/phpunit --testsuite "$suite"
          done

  passed:
    needs: [static, tests]
    runs-on: *runner
    steps:
      - run: 'true'
