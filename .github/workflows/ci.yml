name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      runner:
        type: string
      packages:
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

jobs:
  static:
    runs-on: &runner ${{ inputs.runner || 'ubuntu-24.04' }}
    strategy:
      matrix:
        php: ['8.4', '8.5']
    container: &php shivammathur/node:php-${{ matrix.php }}-24.04
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &extensions
        id: extensions
        run: |
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            $root = json_decode(file_get_contents("composer.json"), true);
            $names = [];
            foreach ([...$lock["packages"], ...$lock["packages-dev"], $root] as $package) {
                foreach ([...array_keys($package["require"] ?? []), ...array_keys($root === $package ? $package["require-dev"] ?? [] : [])] as $name) {
                    if (str_starts_with($name, "ext-")) {
                        $names[substr($name, 4)] = true;
                    }
                }
            }
            echo "list=", implode(",", array_keys($names)), PHP_EOL;
          ' >> "$GITHUB_OUTPUT"
      - &php-setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ steps.extensions.outputs.list }}, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - &composer
        uses: ramsey/composer-install@v4
      - run: vendor/bin/adzercms-check

  tests:
    runs-on: *runner
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        db:
          - image: mysql:lts
            health: mysqladmin ping -h 127.0.0.1 -padzercms
            url: mysql://root:adzercms@db:3306/adzercms_test?charset=utf8mb4
          - image: mariadb:lts
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:adzercms@db:3306/adzercms_test?charset=utf8mb4
          - image: postgres:latest
            health: pg_isready -U postgres
            url: postgresql://postgres:adzercms@db:5432/adzercms_test?charset=utf8
    container: *php
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: adzercms
          MYSQL_DATABASE: adzercms_test
          MARIADB_ROOT_PASSWORD: adzercms
          MARIADB_DATABASE: adzercms_test
          POSTGRES_PASSWORD: adzercms
          POSTGRES_DB: adzercms_test
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und
        options: >-
          --health-cmd "${{ matrix.db.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: ${{ matrix.db.url }}
    steps:
      - *checkout
      - *extensions
      - *php-setup
      - *composer
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends rsync ${{ inputs.packages }}
      - run: |
          for suite in $(sed -n 's/.*<testsuite name="\([^"]*\)".*/\1/p' phpunit.dist.xml); do
            bin/phpunit --testsuite "$suite"
          done

  passed:
    needs: [static, tests]
    runs-on: *runner
    steps:
      - run: 'true'
